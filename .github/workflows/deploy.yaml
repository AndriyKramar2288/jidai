name: Deploy Server Stack

on:
  push:
    branches:
      - master # або назва твоєї головної гілки
    paths:
      - 'server/**' # Тригер лише при змінах у цій папці

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Запуск деплою через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Переходимо в папку проєкту
            cd /home/ubuntu/jidai
            
            # Стягуємо останні зміни
            git fetch origin
            git reset origin/master
            
            # Заходимо в папку сервера
            cd server
            
            # Робимо "розумний" апдейт
            docker compose up -d --build
            
            # (Опціонально) Очищаємо старі імеджі, щоб не забити диск
            docker image prune -f