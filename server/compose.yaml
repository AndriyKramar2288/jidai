services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8883:8883"   # MQTTS
      - "853:853"     # DoT (DNS-over-TLS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/authelia.conf:/etc/nginx/authelia.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docs:/var/www/docs:ro
    depends_on:
      - mosquitto
      - nodered
      - servlets
      - memos
      - authelia
      - grocy
      - actual
      - barcodebuddy
    networks:
      - app-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    command: sh -c "mosquitto_passwd -c -b /tmp/passwd $$MQTT_USER $$MQTT_PASSWORD && chown mosquitto:mosquitto /tmp/passwd && exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - app-network

  nodered:
    image: nodered/node-red:latest
    container_name: nodered-server
    restart: unless-stopped
    user: "1000"
    volumes:
      - nodered_data:/data
      - ./docs:/docs
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  servlets:
    image: jetty:11-jre21
    container_name: lightweight-jetty
    networks:
      - app-network
    environment:
      - JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=servlet
    volumes:
      - ./webapps:/var/lib/jetty/webapps
    restart: unless-stopped

  pyscripts:
    build: ./pyscripts
    container_name: python-scripts
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_SESSION_STRING: ${TG_SESSION_STRING}
      ANKI_COOKIE: ${ANKI_COOKIE}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_USER: ${LASTFM_USER}
      ACTUAL_URL: "http://actual:5006"
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD}
      ACTUAL_SYNC_ID: ${ACTUAL_SYNC_ID}
      MONO_ACC_MAP: ${MONO_ACC_MAP}
      MONO_WEBHOOK_SECRET: ${MONO_WEBHOOK_SECRET}
    networks:
      - app-network

  memos:
    image: ghcr.io/usememos/memos:0.21.0
    container_name: memos
    restart: unless-stopped
    volumes:
      - memos_data:/var/opt/memos
    networks:
      - app-network

  actual:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    volumes:
      - actual_data:/data
    networks:
      - app-network

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    networks:
      - app-network
    environment:
      - TZ=Europe/Kyiv
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}

  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
    volumes:
      - grocy_data:/config
    networks:
      - app-network

  barcodebuddy:
    image: f0rc3/barcodebuddy:latest
    container_name: barcodebuddy
    restart: unless-stopped
    volumes:
      - barcodebuddy_data:/config
    networks:
      - app-network

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
  memos_data:
  actual_data:
  grocy_data:
  barcodebuddy_data:
  adguard_work:
  adguard_conf: