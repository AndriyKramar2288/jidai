theme: dark
default_2fa_method: totp

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

session:
  cookies:
    - name: jidai_session
      domain: # DOMAIN
      expiration: 48h
      authelia_url: # url of the authelia server

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notifications.txt

access_control:
  default_policy: deny
  rules:
    - domain:
        - # mask for the subdomains
        - # DOMAIN
      policy: one_factor
