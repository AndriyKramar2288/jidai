worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 8883 ssl;
        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;
        proxy_pass mosquitto:1883;
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Універсальний редірект на HTTPS для всіх можливих сабдоменів
    server {
        listen 80;
        server_name banew.duckdns.org *.banew.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # 0. AUTHELIA PORTAL
    server {
        listen 443 ssl;
        server_name auth.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://authelia:9091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 1. JETTY
    server {
        listen 443 ssl;
        server_name banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://servlets:8080;
            add_header Content-Security-Policy "upgrade-insecure-requests";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. NODE-RED
    server {
        listen 443 ssl;
        server_name nodered.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        include /etc/nginx/authelia.conf;

        location / {
            proxy_pass http://nodered:1880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. MQTT WebSockets
    server {
        listen 443 ssl;
        server_name mqtt.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://mosquitto:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }

    # 4. MEMOS
    server {
        listen 443 ssl;
        server_name memos.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        client_max_body_size 5G;

        location / {
            proxy_pass http://memos:5230;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 36000s;
        }
    }

    # 5. ASYNCAPI
    server {
        listen 443 ssl;
        server_name docs.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        include /etc/nginx/authelia.conf;

        # Віддаємо все прямо з папки
        location / {
            alias /var/www/docs/;
            index index.html;
            add_header Access-Control-Allow-Origin *;
        }
    }

    # 6. CRAFTY CONTROLLER DASHBOARD
    server {
        listen 443 ssl;
        server_name penis.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        client_max_body_size 500M;

        location / {
            proxy_pass https://172.17.0.1:1488; 
            
            proxy_ssl_verify off;
            proxy_set_header X-Forwarded-Ssl on;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # 7. BLUEMAP
    server {
        listen 443 ssl;
        server_name map.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        location / {
        
            proxy_pass http://172.17.0.1:25566; 
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 8. ACTUAL BUDGET
    server {
        listen 443 ssl;
        server_name budget.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://actual:5006;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_hide_header Cross-Origin-Embedder-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;

            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Opener-Policy same-origin always;

            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
        }
    }

    # 9. GROCY
    server {
        listen 443 ssl;
        server_name grocy.banew.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/banew.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banew.duckdns.org/privkey.pem;

        client_max_body_size 100M;
        # include /etc/nginx/authelia.conf;

        location / {
            proxy_pass http://grocy:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 90s;
        }
    }
}